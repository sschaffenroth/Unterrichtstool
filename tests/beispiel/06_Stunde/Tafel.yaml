# Beispielstunde für die Tests. Erfundene Inhalte, keine echten Notizen.
format: tafelstunde/0
stunde:
  fach: TEST
  nr: 1
  titel: "Beispielstunde"
  datum: 2026-01-01
  dauer: 10
  klasse: Testklasse
anzeigen:
  Board: geteilt
ablaufleiste: true
schritte:
  - id: start
    titel: Start
    abschnitt: "Anfang"
    soll_min: 1
    tafel: { baustein: titel, text: "Beispiel", untertitel: "Untertitel" }
  - id: tipp
    titel: Tipp
    abschnitt: "Anfang"
    soll_min: 1
    tafel: { baustein: bild, datei: bild.png, frage: "Was ist das?", untertitel: "Zweite Zeile" }
    auftrag: { baustein: auftrag, text: "Tippt eine Antwort.", sozialform: EA, dauer_min: 1, material: [{ text: "Arbeitsblatt", url: "https://github.com/x/klasse/blob/main/06_Stunde/02_Arbeitsblatt.md" }, { text: "Link", url: "https://example.org", qr: true }, "Heft"] }
    schueler: { baustein: vorhersage, frage: "Farbe?", optionen: [orange, blau], loesung: orange, aufloesen_in: code }
    regie: { notiz: "Notiz zum Tipp", zaehler: ["Meldungen"] }
  - id: extern
    titel: Referat
    abschnitt: "Mitte"
    soll_min: 1
    zeige: { Board: extern }
  - id: reserve
    titel: Reserve
    abschnitt: "Mitte"
    soll_min: 1
    ausgeblendet: true
    tafel: { baustein: folie, markdown: "**fett** und `code`" }
  - id: code
    titel: Code
    abschnitt: "Mitte"
    soll_min: 2
    tafel:
      reiter:
        - titel: "Code"
          baustein: code
          sprache: python
          quelltext: |
            a = 1
            b = a + 1
            print(b)
          marken:
            - { zeile: 1, label: "eins", einblenden: "Erklärung eins" }
            - { zeile: 3, label: "drei", einblenden: "Erklärung drei" }
        - titel: "Rechnen"
          baustein: zeichnen
          hintergrund: { raster: [[1, 2], [3, 4]], titel: "Raster" }
        - titel: "Nachbar"
          baustein: bild
          datei: ../05_Vorher/nachbar.png
  - id: gp
    titel: GP-Bausteine
    abschnitt: "Ende"
    soll_min: 0
    tafel:
      reiter:
        - titel: "Docstring"
          baustein: code
          sprache: python
          quelltext: |
            def wertung(alter):
                if alter < 18:
                    return "Jugend"
                return "Erwachsene"
          marken:
            - { zeile: 1, label: "D", als: zeile, einblenden: '"""Gibt die Wertung zum Alter zurück. · bleibt"""' }
            - { zeile: 2, label: "K", als: zeile, einblenden: "# unter 18 ist Jugend" }
        - titel: "Kontrollfragen"
          baustein: folie
          aufdecken: true
          markdown: |
            **Frage 1:** Was ist ein Docstring?

            Antwort: der Text direkt unter def.

            **Frage 2:** Wozu ein Kommentar?
        - titel: "Alte App"
          baustein: einbetten
          datei: ../Lernhilfen/demo.html
  - id: ende
    titel: Ende
    abschnitt: "Ende"
    soll_min: 5
    tafel:
      reiter:
        - { titel: "Ergebnis", baustein: ergebnis, von: tipp }
        - { titel: "QR", baustein: qr, url: "https://example.org/repo", text: "Repository" }
        - { titel: "Neu", baustein: neu, name: "wunsch", beschreibung: "Etwas Neues" }
